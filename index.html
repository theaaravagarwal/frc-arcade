<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOSA Arcade</title>
    <style>
      @font-face {
        font-family: "Kenney Pixel";
        src: url("assets/hosa/fonts/kenney-pixel.ttf") format("truetype");
        font-display: block;
      }
      :root {
        --yellow: #f5c400;
        --ink: #10100d;
        --paper: #fff7d1;
        --pink: #ec245f;
        --blue: #1d4e9b;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --motion-fast: 120ms;
        --motion-title: 200ms;
        --motion-view: 200ms;
        --motion-exit: 160ms;
        --motion-accent: 240ms;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: "Kenney Pixel", monospace;
        color: var(--paper);
      }
      body.controller-active {
        cursor: none;
      }
      #cabinet {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0c1224;
        display: grid;
        place-items: center;
      }
      #gameCanvas {
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
        background: #07142b;
      }
      body:not(.playing) #gameCanvas { visibility: hidden; }
      #engineCanvas {
        position: absolute;
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
        pointer-events: none;
      }
      body:not(.playing) #engineCanvas { visibility: hidden; }
      body.engine-ready #gameCanvas { visibility: hidden; }
      #hud, #screen { z-index: 2; }
      #status[data-kind="dev"] {
        margin-left: auto;
        font-size: 12px;
        letter-spacing: 0;
        padding: 5px 8px;
      }
      #hud {
        pointer-events: none;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: clamp(12px, 2vh, 24px);
      }
      .wordmark {
        display: none;
      }
      #status {
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity var(--motion-fast) var(--ease-out),
          transform var(--motion-fast) var(--ease-out);
        background: #111;
        color: #fff7d1;
        border: 3px solid var(--yellow);
        padding: 8px 18px;
        font:
          700 clamp(14px, 1.2vw, 18px) / 1 "Kenney Pixel",
          sans-serif;
        letter-spacing: 0;
      }
      #status.show {
        opacity: 1;
        transform: none;
      }
      #sandboxBadge {
        position: absolute;
        bottom: clamp(52px, 8vh, 80px);
        left: clamp(12px, 2vw, 28px);
        opacity: 0;
        transform: translateY(6px);
        padding: 8px 12px;
        background: var(--pink);
        color: var(--paper);
        border: 3px solid var(--yellow);
        font-size: clamp(18px, 1.5vw, 24px);
        transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
      }
      #sandboxBadge.show { opacity: 1; transform: none; }
      #screen {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .arcade-beat { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#07142baa; color:#fff5d7; text-align:center; }
      .practice-pause strong { font-size: clamp(40px, 6vw, 84px); }
      .practice-pause p { font-size: clamp(20px, 2.5vw, 32px); }
      .arcade-beat p { font:700 22px "Kenney Pixel", monospace; }
      .arcade-beat strong { font-size:clamp(48px,10vw,140px); line-height:1.1; text-shadow:6px 6px #ed245f; }
      .menu-strip em { transition:transform 120ms var(--ease-out); }
      .menu-strip.selected em { transform:scale(1.06); }
      .menu-strip.pressed em { transform:scale(.97); }
      .mania {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--yellow);
        color: var(--ink);
      }
      .arcade-beat.mania { background: #07142baa; color: #fff5d7; }
      .arcade-beat.mania:before { display: none; }
      .mania:before {
        content: "";
        position: absolute;
        inset: 74px 0 auto;
        height: 48px;
        background:
          linear-gradient(45deg, #ce7200 25%, transparent 25% 75%, #ce7200 75%)
            0 0/32px 32px,
          linear-gradient(45deg, #934300 25%, transparent 25% 75%, #934300 75%)
            16px 16px/32px 32px;
        opacity: 0.52;
      }
      .title-ribbon {
        position: absolute;
        z-index: 3;
        top: 3%;
        left: 50%;
        transform: translateX(-50%) skewX(-17deg);
        min-width: 310px;
        padding: 5px 24px 8px;
        text-align: center;
        background: var(--blue);
        border: 5px solid var(--ink);
        box-shadow: 7px 7px 0 var(--pink);
        line-height: 0.9;
      }
      .title-ribbon > * {
        display: block;
        transform: skewX(17deg);
      }
      .title-ribbon small,
      .eyebrow {
        font:
          800 clamp(14px, 1vw, 16px) / 1 "Kenney Pixel",
          sans-serif;
        letter-spacing: 0.14em;
      }
      .title-ribbon strong {
        font-size: clamp(35px, 5vw, 74px);
        letter-spacing: -0.04em;
        color: var(--paper);
        text-shadow: 3px 3px 0 var(--ink);
      }
      .title-ribbon em {
        font:
          700 14px "Kenney Pixel",
          sans-serif;
        color: var(--yellow);
        letter-spacing: 0.15em;
      }
      .scene {
        position: absolute;
        z-index: 1;
        left: -2%;
        top: 17%;
        width: 55%;
        height: 67%;
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, 62% 100%, 0 100%);
        background: #102b63;
        border: 5px solid var(--ink);
      }
      .scene-stack {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .scene-stack .scene {
        transition: opacity var(--motion-fast) var(--ease-out);
      }
      .scene-stack .scene[aria-hidden="true"] {
        opacity: 0;
      }
      .scene svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The cabinet's attract motion lives in the illustration, never in copy. */
      .menu-view .scene[aria-hidden="false"] svg .cell-drift,
      .menu-view .scene[aria-hidden="false"] svg .cell-shot,
      .menu-view .scene[aria-hidden="false"] svg .cell-target,
      .menu-view .scene[aria-hidden="false"] svg .cell-fragment,
      .menu-view .scene[aria-hidden="false"] svg .dash-runner,
      .menu-view .scene[aria-hidden="false"] svg .dash-trail,
      .menu-view .scene[aria-hidden="false"] svg .portal-ring,
      .menu-view .scene[aria-hidden="false"] svg .portal-core,
      .menu-view .scene[aria-hidden="false"] svg .portal-spark {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity;
      }
      .cell-fragment,
      .dash-trail,
      .portal-spark { opacity: 0; }
      .menu-view .scene[aria-hidden="false"] svg .cell-drift { animation: cell-drift 4.4s var(--ease-in-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .cell-drift:nth-of-type(2n) { animation-delay: -1.1s; }
      .menu-view .scene[aria-hidden="false"] svg .cell-shot { animation: cell-fire 4s var(--ease-in-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .cell-target { animation: cell-react 4s var(--ease-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .cell-fragment { animation: cell-fragment 4s var(--ease-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .cell-fragment-a { animation-delay: 0ms; }
      .menu-view .scene[aria-hidden="false"] svg .cell-fragment-b { animation-delay: 40ms; }
      .menu-view .scene[aria-hidden="false"] svg .cell-fragment-c { animation-delay: 80ms; }
      .menu-view .scene[aria-hidden="false"] svg .dash-runner { animation: dash-jump 4.5s linear infinite; }
      .menu-view .scene[aria-hidden="false"] svg .dash-trail { opacity: 0; }
      .menu-view .scene[aria-hidden="false"] svg .dash-trail-near { animation: dash-trail-near 4.5s linear 120ms infinite both; }
      .menu-view .scene[aria-hidden="false"] svg .dash-trail-far { animation: dash-trail-far 4.5s linear 240ms infinite both; }
      .menu-view .scene[aria-hidden="false"] svg .portal-ring { animation: portal-turn 4.5s var(--ease-in-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .portal-core { animation: portal-pulse 4.5s var(--ease-out) infinite; }
      .menu-view .scene[aria-hidden="false"] svg .portal-spark { animation: portal-spark 4.5s var(--ease-out) infinite; }
      @keyframes cell-drift { 0%, 100% { transform: translate(0); } 50% { transform: translate(7px, -5px); } }
      @keyframes cell-fire { 0%, 42%, 72%, 100% { opacity: 0; transform: translate(0); } 46% { opacity: 1; } 68% { opacity: 1; transform: translate(0, -95px); } }
      @keyframes cell-react { 0%, 67%, 100% { opacity: 1; transform: scale(1); } 71% { opacity: .85; transform: scale(1.14); } 76% { opacity: 0; transform: scale(.78); } 93% { opacity: 0; transform: scale(.78); } }
      @keyframes cell-fragment { 0%, 68%, 100% { opacity: 0; transform: translate(0); } 72% { opacity: 1; } 88% { opacity: 0; transform: translate(22px, -18px); } }
      @keyframes dash-jump { 0%, 16% { opacity: 1; transform: translate(0) rotate(0); } 23% { opacity: 1; transform: translate(46px, -65px) rotate(60deg); } 30% { opacity: 1; transform: translate(92px, -117px) rotate(120deg); } 37% { opacity: 1; transform: translate(138px, -157px) rotate(180deg); } 44% { opacity: 1; transform: translate(184px, -179px) rotate(240deg); } 51% { opacity: 1; transform: translate(230px, -177px) rotate(300deg); } 58% { opacity: 1; transform: translate(275px, -150px) rotate(360deg); } 63%, 100% { opacity: 0; transform: translate(292px, -150px) rotate(360deg); } }
      @keyframes dash-trail-near { 0%, 16% { opacity: .38; transform: translate(0) rotate(0); } 23% { opacity: .38; transform: translate(46px, -65px) rotate(60deg); } 30% { opacity: .38; transform: translate(92px, -117px) rotate(120deg); } 37% { opacity: .38; transform: translate(138px, -157px) rotate(180deg); } 44% { opacity: .38; transform: translate(184px, -179px) rotate(240deg); } 51% { opacity: .38; transform: translate(230px, -177px) rotate(300deg); } 58% { opacity: .38; transform: translate(275px, -150px) rotate(360deg); } 63%, 100% { opacity: 0; transform: translate(292px, -150px) rotate(360deg); } }
      @keyframes dash-trail-far { 0%, 16% { opacity: .18; transform: translate(0) rotate(0); } 23% { opacity: .18; transform: translate(46px, -65px) rotate(60deg); } 30% { opacity: .18; transform: translate(92px, -117px) rotate(120deg); } 37% { opacity: .18; transform: translate(138px, -157px) rotate(180deg); } 44% { opacity: .18; transform: translate(184px, -179px) rotate(240deg); } 51% { opacity: .18; transform: translate(230px, -177px) rotate(300deg); } 58% { opacity: .18; transform: translate(275px, -150px) rotate(360deg); } 63%, 100% { opacity: 0; transform: translate(292px, -150px) rotate(360deg); } }
      @keyframes portal-turn { 0%, 55%, 100% { transform: rotate(0); } 73% { transform: rotate(180deg); } 88% { transform: rotate(360deg); } }
      @keyframes portal-pulse { 0%, 56%, 100% { opacity: 1; transform: scale(1); } 68% { opacity: .45; transform: scale(1.18); } 82% { opacity: 1; transform: scale(.96); } }
      @keyframes portal-spark { 0%, 58%, 100% { opacity: 0; transform: translate(-18px, 20px); } 67% { opacity: 1; } 84% { opacity: 0; transform: translate(10px, -12px); } }
      .menu-copy {
        position: absolute;
        z-index: 3;
        left: 6%;
        bottom: 11%;
        width: 40%;
        padding: 14px 18px 16px;
        background: #10100de8;
        color: var(--paper);
        text-shadow: none;
      }
      h1 {
        font-size: clamp(33px, 4.8vw, 72px);
        line-height: 0.86;
        margin: 8px 0;
        letter-spacing: -0.035em;
      }
      .menu-copy p:not(.eyebrow),
      .mission-strip > p {
        font:
          700 clamp(14px, 1.5vw, 23px) / 1.25 "Kenney Pixel",
          sans-serif;
        margin: 0;
        max-width: 480px;
      }
      .menu-strips {
        position: absolute;
        z-index: 4;
        right: 2%;
        top: 30%;
        width: 48%;
      }
      .menu-single .menu-copy {
        left: 8%;
        bottom: 15%;
        width: 46%;
      }
      .menu-single .menu-strips {
        right: 7%;
        top: 42%;
        width: 39%;
      }
      .menu-single .menu-strip {
        min-height: 112px;
        padding-top: 20px;
        padding-bottom: 20px;
      }
      .menu-strip,
      .mission-strip {
        background: #111;
        color: var(--paper);
        clip-path: polygon(6% 0, 100% 0, 93% 100%, 0 100%);
        min-height: 78px;
        margin: 13px 0;
        padding: 14px 8% 13px 11%;
        display: flex;
        align-items: center;
        gap: 18px;
        border-left: 8px solid #111;
        transition:
          transform 180ms var(--ease-out);
      }
      .menu-strip span {
        color: var(--yellow);
        font-size: 20px;
      }
      .menu-strip strong {
        font-size: clamp(24px, 3.5vw, 54px);
        line-height: 0.8;
      }
      .menu-strip strong small {
        display: block;
        color: #ffda28;
        font:
          700 14px "Kenney Pixel",
          sans-serif;
        letter-spacing: 0.16em;
        margin-bottom: 7px;
      }
      .menu-strip em {
        margin-left: auto;
        color: #111;
        background: var(--yellow);
        font:
          900 14px "Kenney Pixel",
          sans-serif;
        padding: 7px;
        font-style: normal;
      }
      .menu-strip.selected {
        background: var(--pink);
        transform: translateX(-12px);
      }
      .menu-strip.selected strong small {
        color: #fff4aa;
      }
      .strip-controls,
      .dev-note {
        position: absolute !important;
        z-index: 5;
        bottom: 0;
        right: 0;
        left: 0;
        padding: 11px 4%;
        background: #10100df2;
        color: var(--paper);
        margin: 0 !important;
        text-align: right;
        font:
          700 clamp(14px, 1.1vw, 17px) / 1.2 "Kenney Pixel",
          sans-serif !important;
        letter-spacing: 0.03em;
      }
      .strip-controls b {
        color: var(--pink);
      }
      .control-prompt {
        width: 1.25em;
        height: 1.25em;
        margin: 0 0.12em -0.28em 0.08em;
        image-rendering: pixelated;
        vertical-align: baseline;
      }
      .dev-note {
        bottom: 43px;
        font-size: 14px !important;
      }
      .mission-view:before {
        opacity: 0.38;
      }
      .mission-view .scene {
        opacity: 0.58;
        width: 62%;
        height: 75%;
        top: 18%;
      }
      .mission-strip {
        position: absolute;
        z-index: 4;
        right: 3%;
        top: 28%;
        width: 48%;
        display: block;
        padding: 28px 10% 26px 13%;
        min-height: 260px;
        clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
        box-shadow: 10px 10px 0 var(--pink);
      }
      .result-score {
        font-size: clamp(45px, 7vw, 104px) !important;
        color: var(--yellow);
        text-shadow: 4px 4px 0 var(--pink);
        margin: 12px 0 !important;
      }
      .result-detail {
        font-size: clamp(14px, 1.3vw, 18px) !important;
        line-height: 1.5 !important;
      }
      .result-detail strong {
        color: #ffdb20;
      }
      .breakthrough-accent {
        position: absolute;
        z-index: 5;
        right: 5%;
        top: 20%;
        width: 18%;
        height: 8px;
        background: var(--pink);
        transform: skewX(-17deg);
        pointer-events: none;
      }
      .reward-view {
        background: #071a3b;
        color: var(--paper);
      }
      .reward-view:before { display: none; }
      .reward-grid-bg {
        position: absolute;
        inset: 0;
        opacity: .34;
        background-image:
          linear-gradient(#315b91 2px, transparent 2px),
          linear-gradient(90deg, #315b91 2px, transparent 2px);
        background-size: 34px 34px;
      }
      .reward-header {
        position: relative;
        z-index: 2;
        width: min(92%, 1120px);
        margin: 3.2vh auto 1.6vh;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 4px 24px;
        border-bottom: 6px solid var(--pink);
        padding: 0 12px 12px;
        text-shadow: 3px 3px #10100d;
      }
      .reward-header p, .reward-header span {
        margin: 0;
        color: #ffdc38;
        font-size: clamp(18px, 1.75vw, 28px);
      }
      .reward-header h1 {
        grid-column: 1 / -1;
        margin: 0;
        font-size: clamp(40px, 5.1vw, 76px);
        color: var(--paper);
      }
      .reward-header span { color: #8df4e5; text-align: right; }
      .reward-cards {
        position: relative;
        z-index: 2;
        width: min(91%, 1120px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(12px, 2vw, 28px);
        align-items: stretch;
      }
      .reward-card {
        position: relative;
        min-width: 0;
        min-height: clamp(350px, 48vh, 480px);
        padding: 14px 16px 18px;
        background: #102653;
        border: 5px solid #fff7d1;
        box-shadow: 8px 8px 0 #10100d;
        transition: transform var(--motion-fast) var(--ease-out);
      }
      .reward-card::after {
        content: "";
        position: absolute;
        inset: -8px;
        border: 4px solid var(--yellow);
        box-shadow: 6px 6px 0 var(--pink);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--motion-fast) var(--ease-out);
      }
      .reward-card-content {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .reward-card.selected {
        background: #1d4e9b;
        border-color: var(--yellow);
        box-shadow: 10px 10px 0 var(--pink);
        transform: translateY(-6px);
      }
      .reward-card.selected::after { opacity: 1; }
      .reward-card-head {
        min-height: 26px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: #8df4e5;
        font-size: clamp(20px, 1.6vw, 24px);
      }
      .reward-card-head b { color: var(--yellow); }
      .advanced-kicker { color: #ffda28; font-size: clamp(15px, 1.2vw, 20px); letter-spacing: .08em; margin: 2px 0 2px; }
      .weapon-path { color: #8df4e5; font-size: clamp(13px, 1.05vw, 18px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .reward-art {
        display: block;
        width: clamp(120px, 14vw, 180px);
        height: auto;
        margin: 8px auto 12px;
        image-rendering: pixelated;
      }
      .reward-art .preview-effect > *, .reward-art .preview-targets,
      .reward-art .preview-drone, .reward-art .preview-pulse,
      .reward-art .preview-barrier {
        transform-box: fill-box;
        transform-origin: center;
      }
      .preview-fan .preview-shot, .preview-spread .preview-shot,
      .preview-barrage .preview-shot, .preview-base .preview-shot {
        stroke-dasharray: 18 42;
        animation: reward-shot 1.2s linear infinite;
      }
      .preview-fan .fan-b { animation-delay: -.18s; }
      .preview-fan .fan-c { animation-delay: -.36s; }
      .preview-fan .fan-d, .preview-barrage .fan-d { animation-delay: -.54s; }
      .preview-fan .fan-e { animation-delay: -.72s; }
      .preview-rail .preview-rail, .preview-lance .preview-rail {
        stroke-dasharray: 58;
        animation: reward-rail 1.1s var(--ease-out) infinite;
      }
      .preview-seeker .preview-seeker {
        stroke-dasharray: 18 68;
        animation: reward-seek 1.3s var(--ease-in-out) infinite;
      }
      .preview-chain .preview-chain {
        stroke-dasharray: 12 70;
        animation: reward-chain 1.2s var(--ease-out) infinite;
      }
      .preview-swarm .preview-orb { animation: reward-orb 1.3s var(--ease-in-out) infinite; }
      .preview-swarm .orb-b { animation-delay: -.3s; }
      .preview-swarm .orb-c { animation-delay: -.6s; }
      .preview-drones .preview-drone { animation: reward-drone 1.4s var(--ease-in-out) infinite; }
      .preview-drones .drone-b { animation-delay: -.7s; }
      .preview-drones .preview-shot { stroke-dasharray: 10 28; animation: reward-shot .7s linear infinite; }
      .preview-pulse .preview-pulse { animation: reward-pulse 1.25s var(--ease-out) infinite; }
      .preview-pulse .pulse-b { animation-delay: -.58s; }
      .preview-barrier .preview-barrier { animation: reward-barrier 1.2s var(--ease-in-out) infinite; }
      .preview-overdrive .preview-shot { stroke-dasharray: 12 38; animation: reward-shot .45s linear infinite; }
      .preview-overdrive .over-b { animation-delay: -.15s; }
      .preview-overdrive .over-c { animation-delay: -.3s; }
      .preview-repair .preview-repair, .preview-repair .preview-plus { animation: reward-repair 1.25s var(--ease-in-out) infinite; }
      .preview-shield .preview-shield-ring { animation: reward-shield 1.2s var(--ease-out) infinite; }
      .preview-shield .ring-b { animation-delay: -.48s; }
      .preview-magnet .preview-magnet { stroke-dasharray: 12 48; animation: reward-shot 1.05s linear infinite; }
      .preview-magnet .preview-pickup { animation: reward-pickup 1.1s var(--ease-in-out) infinite; }
      .preview-magnet .pickup-b { animation-delay: -.27s; }
      .preview-magnet .pickup-c { animation-delay: -.54s; }
      .preview-magnet .pickup-d { animation-delay: -.81s; }
      .preview-thrusters .preview-thrust { animation: reward-thrust .65s var(--ease-out) infinite; }
      .preview-chargecoil .preview-meter { animation: reward-meter 1.1s steps(3, end) infinite; }
      .preview-chargecoil .preview-coil { stroke-dasharray: 10 34; animation: reward-shot .9s linear infinite; }
      .preview-burstcore .preview-burst { animation: reward-burst 1.1s var(--ease-out) infinite; }
      .preview-power .preview-strong-shot, .preview-breakthrough .preview-strong-shot { stroke-width: 6; stroke-dasharray: 26 34; animation: reward-shot .85s linear infinite; }
      .preview-power .side-a, .preview-breakthrough .side-a { animation-delay: -.18s; }
      .preview-power .side-b, .preview-breakthrough .side-b { animation-delay: -.36s; }
      .preview-overclock .preview-shot { stroke-dasharray: 9 24; animation: reward-shot .38s linear infinite; }
      .preview-overclock .fast-b { animation-delay: -.12s; }
      .preview-overclock .fast-c { animation-delay: -.24s; }
      .preview-focus .preview-focus-shot { stroke-width: 6; stroke-dasharray: 48; animation: reward-rail .9s var(--ease-out) infinite; }
      .preview-focus .preview-focus-bracket { animation: reward-focus 1.1s var(--ease-in-out) infinite; }
      @keyframes reward-shot { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
      @keyframes reward-rail { 0%, 30% { opacity: 0; transform: scaleY(.2); } 45%, 72% { opacity: 1; transform: scaleY(1); } 100% { opacity: 0; } }
      @keyframes reward-seek { 0% { stroke-dashoffset: 82; } 55% { stroke-dashoffset: 26; } 100% { stroke-dashoffset: 0; } }
      @keyframes reward-chain { 0%, 22% { opacity: 0; stroke-dashoffset: 82; } 45%, 70% { opacity: 1; stroke-dashoffset: 24; } 100% { opacity: 0; stroke-dashoffset: 0; } }
      @keyframes reward-orb { 0%, 100% { transform: translate(0); opacity: .35; } 50% { transform: translate(0, -16px); opacity: 1; } }
      @keyframes reward-drone { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-7px); } }
      @keyframes reward-pulse { 0% { opacity: .9; transform: scale(.3); } 82%, 100% { opacity: 0; transform: scale(2.2); } }
      @keyframes reward-barrier { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes reward-repair { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes reward-shield { 0% { opacity: .95; transform: scale(.65); } 100% { opacity: 0; transform: scale(1.5); } }
      @keyframes reward-pickup { 0%, 100% { opacity: .45; transform: scale(.8); } 55% { opacity: 1; transform: scale(1.35); } }
      @keyframes reward-thrust { 0%, 100% { opacity: .35; transform: scaleY(.55); } 50% { opacity: 1; transform: scaleY(1.25); } }
      @keyframes reward-meter { 0%, 30% { opacity: .3; } 31%, 65% { opacity: .65; } 66%, 100% { opacity: 1; } }
      @keyframes reward-burst { 0%, 100% { opacity: .25; transform: scale(.5); } 48% { opacity: 1; transform: scale(1.18); } }
      @keyframes reward-focus { 0%, 100% { opacity: .4; transform: scaleX(.7); } 50% { opacity: 1; transform: scaleX(1.2); } }
      .reward-card h2 {
        margin: 0 0 10px;
        color: var(--paper);
        font-size: clamp(26px, 2.8vw, 42px);
        line-height: .95;
      }
      .reward-card p {
        margin: 0;
        color: #fff7d1;
        font-size: clamp(22px, 1.7vw, 27px);
        line-height: 1.15;
      }
      .reward-card small {
        margin-top: auto;
        padding-top: 13px;
        color: #8df4e5;
        font-size: clamp(20px, 1.45vw, 23px);
        line-height: 1.1;
      }
      .reward-build {
        position: relative;
        z-index: 2;
        width: min(91%, 1120px);
        margin: 16px auto 0;
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        background: #10100df0;
        border-left: 6px solid var(--pink);
        font-size: clamp(20px, 1.5vw, 24px);
      }
      .reward-build strong { color: var(--yellow); }
      .reward-build span { max-width: 100%; overflow-wrap: anywhere; }
      .reward-controls {
        position: absolute;
        z-index: 4;
        right: 0;
        bottom: 0;
        left: 0;
        margin: 0;
        padding: 12px 4%;
        background: #10100df5;
        color: var(--paper);
        text-align: center;
        font-size: clamp(22px, 1.8vw, 28px);
      }
      .reward-controls b { color: var(--pink); }
      /* Reward build and developer guidance share the lower band. Keep both
         in normal flow so the fixed controller bar cannot obscure either. */
      .reward-view > .dev-note {
        position: relative !important;
        inset: auto !important;
        width: min(91%, 1120px);
        margin: 8px auto 56px !important;
        padding: 6px 16px;
        background: #10100df2;
        text-align: center;
      }
      .sandbox-view,
      .name-entry-view { pointer-events: auto; background: #071a3b; }
      .sandbox-view:before,
      .name-entry-view:before { display: none; }
      .sandbox-panel,
      .name-entry-panel {
        position: relative;
        z-index: 2;
        width: min(92%, 1160px);
        margin: 3vh auto;
        color: var(--paper);
      }
      .sandbox-panel {
        max-height: 94vh;
        overflow: auto;
        padding: clamp(18px, 2vw, 28px);
        background: #102653;
        border: 5px solid var(--yellow);
        scrollbar-color: var(--pink) #071a3b;
        scrollbar-width: thin;
      }
      .sandbox-panel header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 24px;
        align-items: end;
        border-bottom: 5px solid var(--pink);
        padding-bottom: 12px;
      }
      .sandbox-panel header p,
      .sandbox-panel header h1,
      .sandbox-panel header strong { margin: 0; }
      .sandbox-panel header p { color: #ffdc38; font-size: clamp(18px, 1.6vw, 25px); }
      .sandbox-panel header h1 { grid-column: 1 / -1; font-size: clamp(42px, 5vw, 72px); }
      .sandbox-panel header strong { grid-column: 2; grid-row: 1; color: #8df4e5; font: 700 16px/1.3 system-ui, sans-serif; }
      .sandbox-groups {
        display: grid;
        grid-template-columns: 1fr 1.5fr 1fr;
        gap: clamp(16px, 2vw, 28px);
        margin-top: 20px;
      }
      .sandbox-panel fieldset { min-width: 0; margin: 0; padding: 14px; border: 3px solid #315b91; }
      .sandbox-panel legend { padding: 0 8px; color: var(--yellow); font-size: 24px; }
      .sandbox-hint { margin: 0 0 14px; color: #8df4e5; font: 700 14px/1.3 system-ui, sans-serif; }
      .sandbox-field { display: grid; gap: 6px; margin-bottom: 14px; font: 700 16px/1.3 system-ui, sans-serif; }
      .sandbox-field span { color: var(--paper); }
      .sandbox-panel select,
      .sandbox-panel input[type="number"] {
        width: 100%;
        min-height: 42px;
        border: 2px solid #8db8ee;
        border-radius: 0;
        background: #07142b;
        color: #fff;
        padding: 8px 10px;
        font: 700 16px/1.2 system-ui, sans-serif;
        color-scheme: dark;
      }
      .sandbox-perks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
      .sandbox-check { display: flex; align-items: center; gap: 10px; margin: 16px 0; font: 700 16px/1.3 system-ui, sans-serif; }
      .sandbox-check input { width: 22px; height: 22px; accent-color: var(--pink); }
      .sandbox-error { min-height: 22px; margin: 12px 0; color: #ffb8cb; font: 700 15px/1.3 system-ui, sans-serif; }
      .sandbox-panel footer { display: flex; align-items: center; gap: 12px; }
      .sandbox-panel button {
        min-height: 44px;
        border: 3px solid var(--paper);
        border-radius: 0;
        background: var(--pink);
        color: #fff;
        padding: 8px 16px;
        font: 800 16px/1 system-ui, sans-serif;
        transition: transform var(--motion-fast) var(--ease-out), background-color var(--motion-fast) var(--ease-out);
      }
      .sandbox-panel button:active { transform: scale(.97); }
      .sandbox-panel footer span { margin-left: auto; color: #8df4e5; font: 700 14px/1.2 system-ui, sans-serif; }
      .sandbox-panel :focus-visible,
      .name-entry-panel :focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
      .name-entry-panel {
        width: min(92%, 1060px);
        margin-top: 4vh;
        text-align: center;
      }
      .name-entry-panel header { border-bottom: 5px solid var(--pink); padding-bottom: 8px; }
      .name-entry-panel header p { margin: 0; color: var(--yellow); font-size: 24px; }
      .name-entry-panel h1 { margin: 0; font-size: clamp(48px, 6vw, 82px); }
      .entered-name {
        display: block;
        min-height: 70px;
        margin: 16px 0;
        padding: 8px 16px;
        background: #10100d;
        border: 4px solid var(--paper);
        color: var(--yellow);
        font-size: clamp(38px, 5vw, 64px);
        line-height: 1;
        white-space: pre;
      }
      .name-keyboard { display: grid; grid-template-columns: repeat(var(--name-columns), 1fr); gap: 7px; }
      .name-key {
        min-width: 0;
        min-height: clamp(52px, 5vh, 72px);
        border: 3px solid #8db8ee;
        border-radius: 0;
        background: #102653;
        color: var(--paper);
        font: 700 clamp(28px, 2vw, 40px)/1 "Kenney Pixel", monospace;
        transition: transform var(--motion-fast) var(--ease-out), background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), opacity var(--motion-fast) var(--ease-out);
      }
      .name-key.selected { transform: scale(1.08); background: var(--pink); border-color: var(--yellow); }
      .name-key.disabled { opacity: .46; }
      .name-entry-status { min-height: 25px; margin: 12px 0 8px; color: #8df4e5; font-size: 22px; }
      .name-entry-status.error { color: #ffb8cb; }
      .name-entry-panel footer { padding: 10px; background: #10100d; font-size: 22px; }
      .name-entry-panel footer b { color: var(--pink); }
      .results-leaderboard { margin-top: 12px; }
      .results-leaderboard h2 { margin: 0 0 7px; color: var(--yellow); font-size: clamp(28px, 1.8vw, 36px); }
      .results-leaderboard ol { margin: 0; padding: 0; list-style: none; font-size: clamp(26px, 1.6vw, 32px); line-height: .88; }
      .results-leaderboard li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; padding: 2px 6px; }
      .results-leaderboard li strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .results-leaderboard li.current { background: var(--pink); color: #fff; }
      .results-leaderboard li.own-rank { margin-top: 5px; border-top: 2px solid var(--yellow); }
      .mission-strip:has(.results-leaderboard) {
        top: 21%;
        width: 68%;
        min-height: clamp(390px, 48vh, 520px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, .8fr);
        gap: 26px;
        align-items: center;
      }
      .mission-strip:has(.results-leaderboard) .results-leaderboard { margin: 0; }
      @media (max-aspect-ratio: 1/1) {
        .scene {
          width: 72%;
          height: 48%;
          top: 20%;
        }
        .menu-copy {
          bottom: 8%;
          width: 55%;
        }
        .menu-strips {
          top: 52%;
          width: 65%;
        }
        .menu-single .menu-copy {
          width: 62%;
          bottom: 13%;
        }
        .menu-single .menu-strips {
          top: 54%;
          width: 64%;
        }
        .menu-strip {
          min-height: 54px;
          margin: 6px 0;
        }
        .mission-strip {
          top: 44%;
          width: 76%;
        }
        .reward-cards { grid-template-columns: 1fr; width: min(76%, 620px); }
        .reward-card { min-height: 0; }
        .reward-art { width: 120px; }
        .reward-card p { display: none; }
        .reward-build { display: none; }
      }
      /* Pixel glyphs occupy about half their em square; sizes below are chosen
         from the rendered cabinet view rather than nominal CSS pixels. */
      .title-ribbon small, .eyebrow { font-size: 26px; letter-spacing: 0; }
      .title-ribbon small { color: var(--paper); }
      .menu-copy .eyebrow { margin: 0 0 8px; line-height: 1; }
      .menu-strip em { white-space: nowrap; }
      .title-ribbon em { font-size: 24px; letter-spacing: .04em; }
      .title-ribbon strong { font-size: clamp(60px, 7vw, 96px); }
      .menu-copy h1 { font-size: clamp(54px, 7vw, 100px); }
      .menu-copy p:not(.eyebrow) { font-size: clamp(28px, 2.7vw, 38px); line-height: 1.1; }
      .menu-strip strong { font-size: clamp(40px, 4.6vw, 70px); line-height: .95; }
      .menu-strip strong small, .menu-strip em { font-size: 28px; letter-spacing: 0; }
      .menu-strip span { font-size: 28px; }
      #status { font-size: 28px; }
      .arcade-beat p { font-size: 36px; }
      .result-detail { font-size: clamp(28px, 2.6vw, 36px) !important; }
      .strip-controls { font-size: clamp(30px, 2.5vw, 36px) !important; }
      .dev-note { font-size: 26px !important; bottom: 62px; }
      .menu-copy p, .menu-strip small, .controls, .mission-strip p,
      .result-detail, #status { letter-spacing: 0; }
      .scene svg { image-rendering: pixelated; shape-rendering: crispEdges; }
      @media (prefers-reduced-motion: reduce) {
        html:not([data-motion-preview="full"]) #status,
        html:not([data-motion-preview="full"]) .menu-strip,
        html:not([data-motion-preview="full"]) .scene-stack .scene {
          transition-property: opacity;
          transition-duration: 100ms;
          transform: none !important;
        }
        html:not([data-motion-preview="full"]) .menu-view .scene svg .cell-drift,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .cell-shot,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .cell-target,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .cell-fragment,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .dash-runner,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .dash-trail,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .portal-ring,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .portal-core,
        html:not([data-motion-preview="full"]) .menu-view .scene svg .portal-spark {
          animation: none;
        }
        html:not([data-motion-preview="full"]) .reward-card {
          transition-duration: 100ms;
          transform: none;
        }
        html:not([data-motion-preview="full"]) #sandboxBadge,
        html:not([data-motion-preview="full"]) .sandbox-panel button,
        html:not([data-motion-preview="full"]) .name-key {
          transition-duration: 100ms;
          transform: none;
        }
        html:not([data-motion-preview="full"]) .reward-art * { animation: none !important; }
        html:not([data-motion-preview="full"]) .reward-art .preview-effect > * { stroke-dasharray: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <main id="cabinet">
      <canvas
        id="gameCanvas"
        width="1280"
        height="720"
        aria-label="HOSA game canvas"
      ></canvas>
      <div id="hud">
        <div class="wordmark">HOSA ARCADE</div>
        <div id="status" role="status"></div>
        <div id="sandboxBadge" role="status"></div>
      </div>
      <section id="screen"></section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
